syntax = "proto2";

// =============================================================================
// Mihon / Tachiyomi backup (.tachibk) - the subset DexReader reads and writes
// =============================================================================
// A .tachibk file is a gzip-compressed protobuf of the Backup message. Mihon's
// own model has many more fields (preferences, trackers, extension stores, ...).
// They are deliberately left out: protobufjs skips fields it does not know, so
// upstream additions, renames and removals of data we never use can't break an
// import. Every field is optional for the same reason - a `required` field that
// upstream drops would otherwise fail the whole decode.
//
// Field numbers match Mihon's backup models
// (app/src/main/java/eu/kanade/tachiyomi/data/backup/models).
// =============================================================================

// Backup.kt
message Backup {
  repeated BackupManga backupManga = 1;
  repeated BackupCategory backupCategories = 2;
  repeated BackupSource backupSources = 101;
}

// BackupCategory.kt
message BackupCategory {
  optional string name = 1;
  optional int64 order = 2;
  optional int64 id = 3;
  optional int64 flags = 100;
}

// BackupChapter.kt
message BackupChapter {
  optional string url = 1;
  optional string name = 2;
  optional string scanlator = 3;
  optional bool read = 4;
  optional bool bookmark = 5;
  optional int64 lastPageRead = 6;
  optional int64 dateFetch = 7;
  optional int64 dateUpload = 8;
  optional float chapterNumber = 9;
  optional int64 sourceOrder = 10;
}

// BackupHistory.kt
message BackupHistory {
  optional string url = 1;
  optional int64 lastRead = 2;
  optional int64 readDuration = 3;
}

// BackupManga.kt
message BackupManga {
  optional int64 source = 1;
  optional string url = 2;
  optional string title = 3;
  optional string artist = 4;
  optional string author = 5;
  optional string description = 6;
  repeated string genre = 7;
  optional int32 status = 8;
  optional string thumbnailUrl = 9;
  optional int64 dateAdded = 13;
  repeated BackupChapter chapters = 16;
  repeated int64 categories = 17;
  optional bool favorite = 100;
  repeated BackupHistory history = 104;
}

// BackupSource.kt
message BackupSource {
  optional string name = 1;
  optional int64 sourceId = 2;
}
