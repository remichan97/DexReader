appId: com.remichan97.dexreader
productName: DexReader
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!commitlint.config.mjs'
  - '!bundle-analysis.html'
  - '!docs/**'
  - '!benchmark-results/**'
  - '!scripts/**'
  - '!.github/**'
  - '!.husky/**'
  - '!**/.DS_Store'
  - '!**/Thumbs.db'
  - '!**/*.map'
asar: true
asarUnpack:
  - resources/**
  - out/main/database/migrations/**
compression: maximum
win:
  executableName: dexreader
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage # Universal format - works on all distros
    - deb # Native packages for Ubuntu/Debian/Mint users
  maintainer: remichan97
  category: Entertainment
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: remichan97
  repo: DexReader
  private: false
