name: CI

on:
  push:
    branches: [main]

jobs:
  # Single job that runs all CI checks sequentially
  # More efficient than parallel jobs (1x checkout + 1x npm ci vs 3x each)
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Build the project
        run: npm run build

  create-release-tag:
    runs-on: ubuntu-latest
    needs: ci
    if: |
      contains(github.event.head_commit.message, 'chore: v')
    steps:
      # Check out enough of the code to get the version number from package.json
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full git history for tagging
          sparse-checkout: |
            package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Found package.json version: $VERSION"

      - name: Compare with current commit message
        id: compare_commit
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          EXPECTED="chore: v$VERSION release"

          if [[ "$COMMIT_MSG" == "$EXPECTED" ]]; then
            echo "✅ Commit message matches version: $EXPECTED"
            echo "CREATE_TAG=true" >> $GITHUB_ENV
          else
            echo "⚠️  Commit message mismatch:"
            echo "  Expected: $EXPECTED"
            echo "  Got: $COMMIT_MSG"
            echo "CREATE_TAG=false" >> $GITHUB_ENV
          fi

      - name: Create and push Git tag
        if: env.CREATE_TAG == 'true'
        run: |
          TAG="v$VERSION"

          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️  Tag $TAG already exists, skipping"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create annotated tag
          git tag -a "$TAG" -m "Release $TAG"

          # Push tag
          git push origin "$TAG"

          echo "✅ Created and pushed tag: $TAG"

      - name: Comment on PR (if found)
        if: success() && env.CREATE_TAG == 'true'
        uses: actions/github-script@v7
        continue-on-error: true # Don't fail if we can't find/comment on PR
        with:
          script: |
            const tag = `v${process.env.VERSION}`;

            // With squash merge, PR number isn't in commit message
            // Search for PR that was merged in this commit
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            const pr = prs.find(p => p.merged_at);

            if (pr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `✅ Release tag **${tag}** has been created and pushed after all CI checks passed.\n\nThe release workflow is now running: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/release.yaml`
              });
              console.log(`Commented on PR #${pr.number}`);
            } else {
              console.log('No associated PR found for commenting');
            }
