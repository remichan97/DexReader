name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write # Required for creating and pushing tags

jobs:
  # Single job that runs all CI checks sequentially
  # More efficient than parallel jobs (1x checkout + 1x npm ci vs 3x each)
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Build the project
        run: npm run build

  create-release-tag:
    runs-on: ubuntu-latest
    needs: ci
    if: |
      contains(github.event.head_commit.message, 'chore: v')
    steps:
      # Check out enough of the code to get the version number from package.json
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Need full git history for tagging
          token: ${{ secrets.PAT_TOKEN }} # Use PAT to trigger release workflow
          sparse-checkout: |
            package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Found package.json version: $VERSION"

      - name: Compare with current commit message
        id: compare_commit
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          # Extract first line only (ignore co-author and other metadata)
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n1)
          # Strip PR number if present (GitHub adds this automatically)
          COMMIT_CLEAN=$(echo "$FIRST_LINE" | sed 's/ (#[0-9]\+)$//')
          EXPECTED="chore: v$VERSION release"

          if [[ "$COMMIT_CLEAN" == "$EXPECTED" ]]; then
            echo "✅ Commit message matches version: $EXPECTED"
            echo "CREATE_TAG=true" >> $GITHUB_ENV
          else
            echo "⚠️  Commit message mismatch:"
            echo "  Expected: $EXPECTED"
            echo "  Got (first line): $FIRST_LINE"
            echo "  Cleaned: $COMMIT_CLEAN"
            echo "CREATE_TAG=false" >> $GITHUB_ENV
          fi

      - name: Create and push Git tag
        if: env.CREATE_TAG == 'true'
        run: |
          TAG="v$VERSION"

          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️  Tag $TAG already exists, skipping"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create annotated tag
          git tag "$TAG"

          # Push tag
          git push origin "$TAG"

          echo "✅ Created and pushed tag: $TAG"
