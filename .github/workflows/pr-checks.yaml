name: Pull Request Checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

jobs:
  # Validate PR title, description, and commit messages
  validate-pr:
    runs-on: ubuntu-latest
    # Skip validation for Dependabot PRs
    if: github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: write
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            revert
            build
            ci
          requireScope: false
          subjectPattern: ^.+$ # Ensure there is a subject after the type (and optional scope)
          subjectPatternError: 'PR title must follow the format: <type>(optional scope): <subject>. Accepted types: feat, fix, docs, style, refactor, perf, test, chore, revert, build, ci.'

      - name: Validate PR description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Check if PR body is empty
          if [ -z "$PR_BODY" ] || [ "$PR_BODY" = "null" ]; then
            echo "❌ PR description is empty. Closing PR..."
            COMMENT="This PR has been automatically closed because the description is empty. Please provide a proper description following the pull request template and reopen the PR."
            gh pr close $PR_NUMBER --repo $REPO --comment "$COMMENT"
            exit 1
          fi

          # Check for required sections
          MISSING_SECTIONS=""
          if ! grep -q "## Description" <<< "$PR_BODY"; then
            MISSING_SECTIONS="${MISSING_SECTIONS}- ## Description\n"
          fi
          if ! grep -q "## Checklist" <<< "$PR_BODY"; then
            MISSING_SECTIONS="${MISSING_SECTIONS}- ## Checklist\n"
          fi

          # If any sections are missing, close the PR
          if [ -n "$MISSING_SECTIONS" ]; then
            echo "❌ PR description is missing required sections. Closing PR..."
            COMMENT=$(printf "This PR has been automatically closed because the description does not follow the pull request template. Missing sections:\n\n%b\nPlease update your PR description to include all required sections and reopen the PR." "$MISSING_SECTIONS")
            gh pr close $PR_NUMBER --repo $REPO --comment "$COMMENT"
            exit 1
          fi

          echo "✅ PR description is valid."

      # Step 3: Checkout code with full history for commit validation
      - name: Checkout code with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Step 4: Setup Node.js for commitlint
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Step 5: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 6: Validate all commit messages in the PR
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      # Step 7: Validate last commit (for push events)
      - name: Validate last commit
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

  # Code linting
  # Always run linting for Dependabot PRs, but only run for other PRs if validation passed
  lint-code:
    runs-on: ubuntu-latest
    needs: [validate-pr]
    if: |
      always() && (
        github.actor == 'dependabot[bot]' ||
        needs.validate-pr.result == 'success'
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Type checking
  # Always run type checking for Dependabot PRs, but only run for other PRs if all previous checks passed
  type-check:
    runs-on: ubuntu-latest
    needs: [validate-pr]
    if: |
      always() && (
        github.actor == 'dependabot[bot]' ||
        needs.validate-pr.result == 'success'
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type checking
        run: npm run typecheck
